<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC Virtual</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10131c;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #1c2232;
  padding: 20px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}
main {
  max-width: 900px;
  margin: 25px auto;
  padding: 15px;
}
.card {
  background: #1c2232;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 12px;
}
h2 { color: #48a9ff; }
button {
  background: #1683ee;
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  margin: 5px;
}
button:hover { background: #0864bd; }
#screen {
  background: #080b10;
  border: 2px solid #39465e;
  border-radius: 10px;
  padding: 25px;
  min-height: 250px;
  text-align: center;
}
.status { color: #4bdb8b; }
</style>
</head>
<body>
<header>🖥️ MEU PC VIRTUAL</header>
<main>
  <div class="card">
    <h2>Configuração do PC</h2>
    <p>💻 Processador: Intel Core i9</p>
    <p>🎮 Placa de vídeo: Gráficos virtuais</p>
    <p>⚡ Memória RAM: 64 GB (simulada)</p>
    <p>💾 Armazenamento: 2 TB (simulado)</p>
    <p>🪟 Sistema: Windows simulado</p>
    <p class="status" id="status">● Desligado</p>
    <button onclick="ligar()">Ligar PC</button>
    <button onclick="desligar()">Desligar PC</button>
  </div>

  <div class="card">
    <h2>Área de trabalho</h2>
    <div id="screen">
      <h2>🪟 Windows Virtual</h2>
      <p id="mensagem">Seu PC está desligado.</p>
      <button onclick="abrirApp('Bloco de Notas')">📝 Bloco de Notas</button>
      <button onclick="abrirApp('Navegador')">🌐 Navegador</button>
      <button onclick="abrirApp('Explorador')">📁 Arquivos</button>
    </div>
  </div>
</main>
<script>
let ligado = false;

function ligar() {
  ligado = true;
  document.getElementById("status").textContent = "● Ligado";
  document.getElementById("mensagem").textContent =
    "Bem-vindo ao seu PC virtual!";
}

function desligar() {
  ligado = false;
  document.getElementById("status").textContent = "● Desligado";
  document.getElementById("mensagem").textContent =
    "Seu PC está desligado.";
}

function abrirApp(nome) {
  if (!ligado) {
    alert("Ligue o PC primeiro!");
    return;
  }
  document.getElementById("mensagem").textContent =
    nome + " aberto no PC virtual.";
}
</script>
</body>
</html>
